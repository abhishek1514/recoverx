services:
  # Managed PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: recoverx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recoverx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoverx_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-recoverx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoverx_user} -d ${POSTGRES_DB:-recoverx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Distributed Redis Rate Limiting Service
  redis:
    image: redis:7-alpine
    container_name: recoverx-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-Compatible Cloud Object Storage Service (MinIO)
  minio:
    image: minio/minio:latest
    container_name: recoverx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-Shot MinIO Bucket Initializer
  minio-init:
    image: minio/mc:latest
    container_name: recoverx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_secret};
      /usr/bin/mc mb --ignore-existing local/recoverx-documents;
      exit 0;
      "

  # RecoverX FastAPI API Service
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverx-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql://recoverx_user:recoverx_secure_pass@postgres:5432/recoverx
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_staging_dummy}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-staging_dummy_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-recoverx_staging_webhook_secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - JWT_SECRET=${JWT_SECRET:-recoverx_staging_jwt_secret_32_bytes_min}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - WEBHOOK_TOLERANCE_SECONDS=${WEBHOOK_TOLERANCE_SECONDS:-300}
      - PORT=8000
      - RATE_LIMIT_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OBJECT_STORAGE_PROVIDER=s3
      - S3_BUCKET=recoverx-documents
      - S3_REGION=us-east-1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # RecoverX Dedicated Background Worker Service
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverx-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql://recoverx_user:recoverx_secure_pass@postgres:5432/recoverx
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_staging_dummy}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-staging_dummy_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-recoverx_staging_webhook_secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-recoverx_staging_jwt_secret_32_bytes_min}
      - RATE_LIMIT_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OBJECT_STORAGE_PROVIDER=s3
      - S3_BUCKET=recoverx-documents
      - S3_REGION=us-east-1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "grep -qs 'app.workers.worker' /proc/[0-9]*/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  minio_data:
